apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle8-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8
      version: green
  template:
    metadata:
      labels:
        app: vle8
        version: green
    spec:
      containers:
      - name: vle8
        image: aryan9044gupta/vle8-demo:green
        ports:
        - containerPort: 80
