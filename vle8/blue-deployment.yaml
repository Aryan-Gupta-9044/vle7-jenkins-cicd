apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle8-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8
      version: blue
  template:
    metadata:
      labels:
        app: vle8
        version: blue
    spec:
      containers:
      - name: vle8
        image: aryan9044gupta/vle8-demo:blue
        ports:
        - containerPort: 80
